# Fast local iteration aliases (no fat LTO; pair with STREAMERZ_CONFIG or --config).
[alias]
fcheck = "check --bin Streamerz"
fbuild = "build --profile fast --bin Streamerz"
frun = "run --profile fast --bin Streamerz --"
ftest = "test --bin Streamerz"

# Put the C runtime inside Streamerz.exe, so it runs without the Visual C++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
