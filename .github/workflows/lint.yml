# Same checks as the git hooks in .githooks, so a PR can't skip them.
name: lint

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LOCALIZATION.md'
      - 'SECURITY.md'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-deps-${{ runner.os }}-
      # FLTK (the window) builds from source against these; dbus is the tray. The TikTok test drives the
      # runner's own Chrome.
      - run: |
          mkdir -p ~/.apt-cache
          sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev \
            libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            wayland-protocols libdbus-1-dev libxkbcommon-dev libegl-dev libopengl-dev mold
          cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "streamerz-deps"
          cache-all-crates: true
      - run: cargo test --profile ci-test --locked
      - run: cargo clippy --profile ci-test --all-targets --locked -- -D warnings
      - name: Prune transient build artifacts before caching
        run: |
          rm -rf target/release/incremental target/ci-test/incremental target/debug/incremental 2>/dev/null || true
          find target -type f -name "*.d" -delete 2>/dev/null || true
      - name: Test TikTok extension lifecycle
        run: node --test dev/tiktok-extension.test.mjs

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >
          npx --yes --package @commitlint/cli@21 --package @commitlint/config-conventional@21
          commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
