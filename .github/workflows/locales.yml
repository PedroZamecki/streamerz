# Checks the languages when one changes: same keys as English, same {placeholders}, a name.
name: locales

on:
  pull_request:
    paths: ["assets/locales/**", "dev/locale.py"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 dev/locale.py check
