# Pull requests: build streamerz-windows-x86_64.exe (Windows) and streamerz-linux-x86_64 (Linux) as checks,
# caching binaries by repo tree hash and version tag.
# Merges to main: pick the next version from the commits since the last tag
# (breaking "type!: " -> major, feat -> minor, fix/perf -> patch); if binaries match the PR cache,
# rebuild is skipped and the cached artifacts are published directly.
# Merges with only chore/ci/docs/... commits don't release.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      tree: ${{ steps.tree.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tree
        shell: bash
        run: echo "hash=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - id: next
        shell: bash
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          last=${last:-v0.0.0}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log=$(git log origin/${{ github.base_ref }}..HEAD --format=%s 2>/dev/null || true)
            if [ -z "$log" ]; then log="${{ github.event.pull_request.title }}"; fi
          else
            log=$(git log ${last:+"$last.."}HEAD --format=%s)
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$log"; then major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then minor=$((minor + 1)); patch=0
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<< "$log"; then patch=$((patch + 1))
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "no feat/fix since $last: no release"; exit 0
          else
            patch=$((patch + 1))
          fi
          echo "next release: v$major.$minor.$patch"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: always() && (github.event_name != 'push' || needs.version.outputs.tag != '')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Cache built binary
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: dist/streamerz-windows-x86_64.exe
          key: bin-win-${{ needs.version.outputs.tree }}-${{ needs.version.outputs.tag }}
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          f=$(ls "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/fltk-sys-*/cfltk/fltk/CMake/options.cmake)
          perl -pi -e 's/(option\(FLTK_MSVC_RUNTIME_DLL .*)ON\)/${1}OFF)/' $f
          grep -q 'FLTK_MSVC_RUNTIME_DLL .*OFF)' $f
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked
        env:
          STREAMERZ_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        name: Stage Windows binary
        run: |
          mkdir -p dist
          cp target/release/streamerz.exe dist/streamerz-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: streamerz-windows
          path: dist/streamerz-windows-x86_64.exe

  linux:
    needs: version
    if: always() && (github.event_name != 'push' || needs.version.outputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache built Linux binaries
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: |
            dist/streamerz-linux-x86_64
            dist/streamerz-tiktok-linux-x86_64
            dist/streamerz-linux-x86_64.AppImage*
          key: bin-linux-${{ needs.version.outputs.tree }}-${{ needs.version.outputs.tag }}
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-deps-${{ runner.os }}-
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        name: Cache linuxdeploy
        uses: actions/cache@v4
        with:
          path: /tmp/appimage-tools
          key: linuxdeploy-alpha-20251107-1
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        name: Install dependencies
        run: |
          mkdir -p ~/.apt-cache
          sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev \
            libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            wayland-protocols libdbus-1-dev libxkbcommon-dev libegl-dev libopengl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libfuse2
          cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked
        env:
          STREAMERZ_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        run: dev/appimage.sh "${{ needs.version.outputs.tag || 'dev' }}"
      - if: steps.bin-cache.outputs.cache-hit != 'true'
        name: Stage Linux release assets
        run: |
          mkdir -p dist
          cp target/release/streamerz dist/streamerz-linux-x86_64
          if [ -f target/release/streamerz-tiktok ]; then
            cp target/release/streamerz-tiktok dist/streamerz-tiktok-linux-x86_64
          fi
          if [ -f streamerz-linux-x86_64.AppImage ]; then
            cp streamerz-linux-x86_64.AppImage* dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: streamerz-linux
          path: dist/*

  release:
    needs: [version, windows, linux]
    if: needs.version.outputs.tag != '' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        run: >
          gh release create "${{ needs.version.outputs.tag }}"
          artifacts/*
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
