# Pull requests: build Streamerz-windows-x86_64.exe (Windows) and Streamerz-linux-x86_64.AppImage as checks,
# and keep them as artifacts named after the version and the repo's tree hash.
# Merges to main: pick the next version from the commits since the last tag
# (breaking "type!: " -> major, feat -> minor, fix/perf -> patch). If the merged tree is the one a pull
# request already built (same tree, same version), those artifacts are published as they are: no second
# build. Otherwise it builds, then publishes. Merges with only chore/ci/docs/... commits don't release.
# PRs are merged with merge commits (never squashed), so every commit of the history stays.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.githooks/**'
      - 'commitlint.config.mjs'
      - 'CONTRIBUTING.md'
      - 'LOCALIZATION.md'
      - 'SECURITY.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.githooks/**'
      - 'commitlint.config.mjs'
      - 'CONTRIBUTING.md'
      - 'LOCALIZATION.md'
      - 'SECURITY.md'
  workflow_dispatch:

# Read only by default: only the release job writes (a fork's pull request never can).
permissions:
  contents: read
  actions: read

# A newer push to a pull request replaces its run; a run on main is never cancelled (it's a release).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      tree: ${{ steps.tree.outputs.hash }}
      reuse: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tree
        shell: bash
        run: echo "hash=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - id: next
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          last=${last:-v0.0.0}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log=$(git log "origin/$BASE_REF..HEAD" --format=%s 2>/dev/null || true)
            if [ -z "$log" ]; then log="$PR_TITLE"; fi
          else
            log=$(git log ${last:+"$last.."}HEAD --format=%s)
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$log"; then major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then minor=$((minor + 1)); patch=0
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<< "$log"; then patch=$((patch + 1))
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "no feat/fix since $last: no release"; exit 0
          else
            patch=$((patch + 1))
          fi
          echo "next release: v$major.$minor.$patch"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
      # On main: the pull request run that already built this exact tree and version, if any.
      - id: reuse
        if: github.event_name == 'push' && steps.next.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="${{ steps.next.outputs.tag }}-${{ steps.tree.outputs.hash }}"
          for id in $(gh run list --workflow build.yml --event pull_request --status success --limit 40 \
                        --repo "${{ github.repository }}" --json databaseId --jq '.[].databaseId'); do
            names=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '.artifacts[].name')
            if grep -qx "streamerz-windows-$want" <<< "$names" && grep -qx "streamerz-linux-$want" <<< "$names"; then
              echo "reusing the binaries of run $id"
              echo "run=$id" >> "$GITHUB_OUTPUT"
              break
            fi
          done
  windows:
    needs: [version]
    if: (github.event_name != 'push' || needs.version.outputs.tag != '') && !github.event.pull_request.draft
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Take the pull request's binary
        if: needs.version.outputs.reuse != ''
        uses: actions/download-artifact@v4
        with:
          name: streamerz-windows-${{ needs.version.outputs.tag }}-${{ needs.version.outputs.tree }}
          path: dist
          run-id: ${{ needs.version.outputs.reuse }}
          github-token: ${{ github.token }}
      - if: needs.version.outputs.reuse == ''
        uses: actions/checkout@v4
      - name: Set up sccache
        if: needs.version.outputs.reuse == ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"
      - if: needs.version.outputs.reuse == ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "streamerz-windows-deps"
          cache-all-crates: true
      - if: needs.version.outputs.reuse == ''
        run: |
          cargo fetch --locked
      - if: needs.version.outputs.reuse == ''
        run: cargo build --release --locked --bin Streamerz
        env:
          STREAMERZ_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
      # Every unit test on real Windows (the Windows-only ones too: DPAPI, the Run key, Toolhelp, the file
      # watcher, Windows line endings), on the PR runner. Reuses release profile artifacts already built.
      - if: github.event_name == 'pull_request'
        name: Run the unit tests on Windows
        run: cargo test --release --locked --bin Streamerz
      # Every scenario (tests/scenarios) on the exe just built, on real Windows.
      - if: github.event_name == 'pull_request' && needs.version.outputs.reuse == ''
        name: Run the scenarios on the Windows exe
        run: ./target/release/Streamerz.exe --scenario tests/scenarios
      - if: needs.version.outputs.reuse == ''
        name: Stage Windows binary
        run: |
          mkdir -p dist
          cp target/release/Streamerz.exe dist/Streamerz-windows-x86_64.exe
      - if: needs.version.outputs.reuse == ''
        name: Verify the Windows executable icon
        run: python dev/check-windows-icon.py dist/Streamerz-windows-x86_64.exe
      - if: needs.version.outputs.reuse == ''
        name: Verify Windows version metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
        run: |
          $expected = if ($env:RELEASE_VERSION -eq 'dev') { '0.0.0.0' } else { $env:RELEASE_VERSION.TrimStart('v') + '.0' }
          $info = (Get-Item dist/Streamerz-windows-x86_64.exe).VersionInfo
          if ($info.ProductName -ne 'Streamerz' -or $info.FileDescription -ne 'Streamerz' -or
              $info.ProductVersion -ne $expected -or $info.FileVersion -ne $expected) {
            throw "Unexpected Windows metadata: $($info | Format-List | Out-String)"
          }
      - name: Prune transient build artifacts before caching
        if: needs.version.outputs.reuse == ''
        run: |
          rm -rf target/release/incremental target/ci-test/incremental target/debug/incremental 2>/dev/null || true
          find target -type f -name "*.d" -delete 2>/dev/null || true
      # Sign the Windows executable for releases when SignPath secrets are configured.
      - name: Upload Windows binary for SignPath signing
        id: upload-for-signpath
        if: github.event_name == 'push' && needs.version.outputs.tag != '' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-binary
          path: dist/Streamerz-windows-x86_64.exe
          retention-days: 1
      - name: Sign Windows executable via SignPath
        if: github.event_name == 'push' && needs.version.outputs.tag != '' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'streamerz' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-for-signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-bin
      - name: Stage signed Windows binary
        if: github.event_name == 'push' && needs.version.outputs.tag != '' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          cp signed-bin/Streamerz-windows-x86_64.exe dist/Streamerz-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: streamerz-windows-${{ needs.version.outputs.tag || 'dev' }}-${{ needs.version.outputs.tree }}
          path: dist/Streamerz-windows-x86_64.exe
          retention-days: 3

  linux:
    needs: [version]
    if: (github.event_name != 'push' || needs.version.outputs.tag != '') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Take the pull request's binaries
        if: needs.version.outputs.reuse != ''
        uses: actions/download-artifact@v4
        with:
          name: streamerz-linux-${{ needs.version.outputs.tag }}-${{ needs.version.outputs.tree }}
          path: dist
          run-id: ${{ needs.version.outputs.reuse }}
          github-token: ${{ github.token }}
      - if: needs.version.outputs.reuse == ''
        uses: actions/checkout@v4
      - name: Set up sccache
        if: needs.version.outputs.reuse == ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"
      - if: needs.version.outputs.reuse == ''
        name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-deps-${{ runner.os }}-
      - if: needs.version.outputs.reuse == ''
        name: Cache linuxdeploy
        uses: actions/cache@v4
        with:
          path: /tmp/appimage-tools
          key: linuxdeploy-alpha-20251107-1
      - if: needs.version.outputs.reuse == ''
        name: Install dependencies
        run: |
          mkdir -p ~/.apt-cache
          sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libssl-dev \
            libfuse2 mold
          cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
      - if: needs.version.outputs.reuse == ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "streamerz-deps"
          cache-all-crates: true
      - if: needs.version.outputs.reuse == ''
        run: cargo build --release --locked
        env:
          STREAMERZ_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      - if: needs.version.outputs.reuse == ''
        run: dev/appimage.sh "${{ needs.version.outputs.tag || 'dev' }}"
      - if: needs.version.outputs.reuse == ''
        name: Stage Linux release assets
        run: |
          mkdir -p dist
          cp Streamerz-linux-x86_64.AppImage* dist/
      - name: Prune transient build artifacts before caching
        if: needs.version.outputs.reuse == ''
        run: |
          rm -rf target/release/incremental target/ci-test/incremental target/debug/incremental 2>/dev/null || true
          find target -type f -name "*.d" -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: streamerz-linux-${{ needs.version.outputs.tag || 'dev' }}-${{ needs.version.outputs.tree }}
          path: dist/*
          retention-days: 3

  release:
    needs: [version, windows, linux]
    if: always() && !cancelled() && needs.version.outputs.tag != '' && github.event_name == 'push' && needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: streamerz-*-${{ needs.version.outputs.tag }}-${{ needs.version.outputs.tree }}
          path: artifacts
          merge-multiple: true
      # Notes list every commit since the last tag (GitHub's generator only lists pull requests).
      - name: Write release notes
        shell: bash
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          : > notes.md
          section() {
            lines=$(git log ${last:+"$last..HEAD"} --no-merges --format='- %s (%h)' -E --grep="$2" || true)
            if [ -n "$lines" ]; then printf '## %s\n\n%s\n\n' "$1" "$lines" >> notes.md; fi
          }
          section "Breaking changes" '^[a-z]+(\([^)]*\))?!:'
          section "Features" '^feat(\([^)]*\))?:'
          section "Fixes" '^fix(\([^)]*\))?:'
          section "Performance" '^perf(\([^)]*\))?:'
          section "Other changes" '^(refactor|docs|test|build|ci|chore|style|revert)(\([^)]*\))?:'
          if [ -n "$last" ]; then
            printf '**Full changelog**: https://github.com/%s/compare/%s...%s\n' "${{ github.repository }}" "$last" "${{ needs.version.outputs.tag }}" >> notes.md
          fi
      - name: Publish release
        run: >
          gh release create "${{ needs.version.outputs.tag }}"
          artifacts/*
          --title "${{ needs.version.outputs.tag }}"
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
