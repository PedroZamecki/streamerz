name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Streamerz version
      description: Shown in the window's title.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Log page (turn on Debug lines in Settings for more) or the Crashes page. No logins are in them.
      render: text
