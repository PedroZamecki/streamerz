[package]
name = "streamerz-voice"
version = "1.0.0"
edition = "2021"
publish = false
description = "Neural voices for Streamerz, over sherpa-onnx"
# sherpa-onnx 1.13.8 bundles espeak-ng (GPL-3.0-or-later) statically; Streamerz itself stays MIT
# and talks to this separate optional program over stdin and stdout.
license = "GPL-3.0-or-later"

# Its own workspace: Streamerz downloads it only when neural voices are turned on.
[workspace]

[[bin]]
name = "Streamerz-Voice"
path = "src/main.rs"

[dependencies]
# Statically linked (with ONNX Runtime): one file, nothing else to install.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
serde_json = "1"
# The models come as .tar.bz2: unpacked here so Streamerz itself needs no bzip2. Pure Rust.
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
