[package]
name = "streamerz-frontend"
version = "0.0.0"
edition = "2021"
publish = false

[features]
test-support = ["gpui-kit/test-support", "dep:raw-window-handle", "dep:image", "dep:windows-sys"]

[dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets"] }
serde_json = "1"

# Already used by GPUI; direct access is needed only for app-window development captures.
raw-window-handle = { version = "0.6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
