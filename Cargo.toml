[package]
name = "streamerz"
version = "0.0.0"         # unused: releases are versioned by git tags (see build workflow)
edition = "2021"
default-run = "Streamerz"

[[bin]]
name = "Streamerz"
path = "src/main.rs"

[features]
# Development instrumentation for the frontend (window captures, synthetic input, the MCP `ui` tool).
dev-ui = ["streamerz-frontend/test-support"]

[dependencies]
streamerz-frontend = { path = "frontend" }
tokio = { version = "1.53.3", features = [
    "rt",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    "signal",
] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
] }
sha2 = "0.11"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
base64 = "0.22"
# Import/export strings are gzipped; miniz_oxide is pure Rust.
flate2 = { version = "1", default-features = false, features = [
    "rust_backend",
] }
regex-lite = "0.1"
# HTTPS with the OS TLS (SChannel / OpenSSL); the same crates tokio-tungstenite uses for wss://.
native-tls = "0.2"
tokio-native-tls = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
# Plugins (WebAssembly), interpreted: nothing is loaded until a plugin is turned on. Portable dispatch:
# the tail-call one overflowed the stack at opt-level 0 (dev builds and tests).
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

# Fast local builds (`cargo fbuild` / `cargo frun`): incremental, no fat LTO, optimized deps.
[profile.fast]
inherits = "dev"
opt-level = 1

# CI test profile: fast compilation, opt-level 1 for speedy scenario execution, no LTO
[profile.ci-test]
inherits = "dev"
opt-level = 1
debug = false
incremental = false


[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
# Already in the build through ksni (same version): the Secret Service for secrets.rs.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Already in the build through tokio (same version): inotify for the file watchers (fswatch.rs).
libc = "0.2"

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.0", default-features = false }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "UI_Notifications", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch", "wat"] }
wat = "1"

[patch.crates-io]
tray-icon = { path = "patches/tray-icon" }


[workspace]
members = ["frontend"]
default-members = ["."]
resolver = "2"
