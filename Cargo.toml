[package]
name = "streamerz"
version = "0.0.0" # unused: releases are versioned by git tags (see build workflow)
edition = "2021"

# Linux only: TikTok's pages (login, sending chat) in their own binary, so streamerz itself doesn't load
# WebKitGTK. On Windows it's built into streamerz.exe (`--tiktok`), and this one is just never shipped.
[[bin]]
name = "streamerz-tiktok"
path = "src/tiktok_web.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
# Import/export strings are gzipped; miniz_oxide is pure Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex-lite = "0.1"
# HTTPS with the OS TLS (SChannel / OpenSSL); the same crates tokio-tungstenite uses for wss://.
native-tls = "0.2"
tokio-native-tls = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
fltk = "1.5.23"
# The OS webview (WebKitGTK / WebView2) for TikTok's login and chat, in a child process only.
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = "0.37"
# WebP emotes and avatars (BTTV, 7TV, Kick, TikTok serve WebP); FLTK decodes PNG/JPEG/GIF/SVG itself.
image-webp = "0.2"
# Twitch serves animated emotes only as GIF; FLTK reads only their first frame (and not into RGB).
gif = { version = "0.14.2", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
fltk = { version = "1.5.23", features = ["use-wayland"] }
ksni = "0.3.6"
# Already in the build through ksni (same version): the Secret Service for secrets.rs.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target."cfg(windows)".dependencies]
fltk = { version = "1.5.23", features = ["static-msvcrt"] }
tray-icon = { version = "0.26.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.11"
