[package]
name = "streamerz"
version = "0.0.0" # unused: releases are versioned by git tags (see build workflow)
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
# Import/export strings are gzipped; miniz_oxide is pure Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex-lite = "0.1"
# HTTPS with the OS TLS (SChannel / OpenSSL); the same crates tokio-tungstenite uses for wss://.
native-tls = "0.2"
tokio-native-tls = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
fltk = { version = "1.5.23", features = ["no-images"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
fltk = { version = "1.5.23", features = ["use-wayland"] }
ksni = "0.3.6"

[target."cfg(windows)".dependencies]
fltk = { version = "1.5.23", features = ["static-msvcrt"] }
tray-icon = { version = "0.26.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.11"
