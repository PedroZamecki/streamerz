<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top gifters</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 22px var(--font, system-ui), system-ui, sans-serif; color: var(--color); }
  #board { margin: 12px; padding: 22px; border-radius: 16px; background: var(--background); }
  h1 { margin: 0 0 20px; font-size: 30px; }
  .row { display: flex; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid #ffffff20; }
  .rank { color: var(--accent); width: 1.5em; font-weight: 800; }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-weight: 800; font-variant-numeric: tabular-nums; }
  #empty { opacity: .6; }
</style>
</head>
<body>
<div id="board"><h1 id="title"></h1><div id="rows"></div><div id="empty">No gifts yet</div></div>
<script>
// Ordinary actions keep score_<period>_twitch_<user ID> and name_<period>_twitch_<user ID>.
// They run with this page closed, survive restarts, and keep same-named users separate by ID.
// Settings arrive after each action writes a value. Changing Period selects a fresh board.
let settings = streamerz.settings;
const rows = document.getElementById("rows");
function draw(entries) {
  rows.replaceChildren();
  entries.sort((a, b) => b.count - a.count || a.user.localeCompare(b.user));
  for (const [i, entry] of entries.slice(0, Math.max(1, Math.min(50, Number(settings.rows) || 5))).entries()) {
    const row = document.createElement("div");
    row.className = "row";
    for (const [kind, text] of [["rank", i + 1], ["name", entry.user], ["count", entry.count]]) {
      const cell = document.createElement("span");
      cell.className = kind;
      cell.textContent = text;
      row.append(cell);
    }
    rows.append(row);
  }
  document.getElementById("empty").hidden = entries.length > 0;
}
streamerz.onSettings(s => {
  settings = s;
  const style = document.documentElement.style;
  for (const key of ["color", "accent", "background"]) style.setProperty("--" + key, s[key]);
  style.setProperty("--font", s.font ? '"' + s.font + '"' : "system-ui");
  document.getElementById("title").textContent = s.title;
  const prefix = "score_" + s.period + "_";
  draw(Object.entries(s).filter(([key, value]) => key.startsWith(prefix) && Number(value) > 0)
    .map(([key, value]) => ({ user: s["name_" + key.slice(6)] || key.slice(prefix.length), count: Number(value) })));
});
streamerz.on("gifters.preview", entries => { if (streamerz.testing && Array.isArray(entries)) draw(entries); });
</script>
</body>
</html>
