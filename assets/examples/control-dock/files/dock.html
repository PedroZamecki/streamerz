<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { font: 14px var(--font, system-ui), system-ui, sans-serif; background: #18181b; color: #e4e4e7; }
  #grid { display: grid; grid-template-columns: repeat(var(--columns, 2), 1fr); gap: 8px; padding: 10px; }
  button { font: inherit; font-weight: 600; min-height: 46px; padding: 8px 10px; border: 0; border-radius: 8px; cursor: pointer;
    color: #fff; background: var(--button, #7c3aed); text-align: center; overflow-wrap: anywhere;
    transition: transform .08s ease, filter .15s ease; }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(.97); }
  button.main { grid-column: 1 / -1; min-height: 64px; font-size: 1.15em; }
  button.ran { animation: ran .6s ease; }
  @keyframes ran { 30% { box-shadow: 0 0 0 4px rgba(255, 255, 255, .5); } }
  button:disabled { opacity: .45; cursor: default; }
  #note { padding: 0 10px 10px; color: #a1a1aa; font-size: 12px; }
  #note.bad { color: #f87171; }
  #bar { display: flex; justify-content: flex-end; padding: 6px 10px 0; }
  #reload { min-height: 0; padding: 4px 8px; background: #27272a; font-weight: 500; font-size: 12px; }
</style>
</head>
<body>
<div id="bar"><button id="reload">Reload buttons</button></div>
<div id="grid"></div>
<div id="note"></div>
<script>
// A dock for OBS (Docks, Custom browser docks) with a button for each action connected to this overlay.
// streamerz.actions() lists them and streamerz.run() runs one: both need the permission "Run the
// actions connected to it". Add an action to the overlay's group in Actions and press Reload buttons.
// The "Big button" setting is an "action" setting: one of those actions, picked by name.
let settings = streamerz.settings;

streamerz.onSettings(s => {
  settings = s;
  const root = document.documentElement.style;
  root.setProperty("--columns", Number(s.columns) || 2);
  root.setProperty("--button", s.buttonColor || "#7c3aed");
  root.setProperty("--font", s.font ? '"' + s.font + '"' : "system-ui");
  load();
});

function say(text, bad) {
  note.textContent = text;
  note.className = bad ? "bad" : "";
}

async function load() {
  let list;
  try {
    list = await streamerz.actions();
  } catch (error) {
    return say(error.message, true);
  }
  grid.replaceChildren();
  // The big one first, then the rest by name.
  list.sort((a, b) => (b.id === settings.main) - (a.id === settings.main) || a.name.localeCompare(b.name));
  for (const action of list) {
    const button = document.createElement("button");
    button.textContent = action.name;
    button.disabled = !action.enabled;
    button.title = action.enabled ? "" : "This action is off";
    if (action.id === settings.main) button.classList.add("main");
    button.onclick = async () => {
      if (settings.confirm && !confirm("Run " + action.name + "?")) return;
      try {
        await streamerz.run(action.id);
        button.classList.remove("ran");
        void button.offsetWidth;
        button.classList.add("ran");
        say("Ran " + action.name);
      } catch (error) {
        say(error.message, true);
      }
    };
    grid.append(button);
  }
  if (!list.length) say("No actions are connected to this overlay yet.");
}

reload.onclick = load;
</script>
</body>
</html>
