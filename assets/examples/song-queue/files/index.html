<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Song request queue</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 20px var(--font, system-ui), system-ui, sans-serif; color: var(--color); }
  #queue { margin: 12px; padding: 22px; border-radius: 16px; background: var(--background); }
  h1 { margin: 0 0 18px; font-size: 30px; }
  .song { display: flex; gap: 16px; padding: 12px 0; border-top: 1px solid #ffffff20; }
  .number { color: var(--accent); font-weight: 800; min-width: 1.2em; }
  .details { min-width: 0; }
  .title, .artist, .user { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title { font-weight: 700; }
  .artist, .user, #empty { opacity: .65; font-size: 16px; }
</style>
</head>
<body>
<div id="queue"><h1 id="title"></h1><div id="rows"></div><div id="empty"></div></div>
<script>
// The song request actions publish their queue for any overlay to read. The current value is sent
// on opening too. Another template can publish an array of {title, artist, user} to a different topic.
let settings = streamerz.settings;
let topic = "";
let songs = [];
const rows = document.getElementById("rows");
function draw() {
  rows.replaceChildren();
  for (const [i, song] of songs.slice(0, Math.max(1, Math.min(50, Number(settings.rows) || 5))).entries()) {
    const row = document.createElement("div"); row.className = "song";
    const number = document.createElement("span"); number.className = "number"; number.textContent = i + 1;
    const details = document.createElement("div"); details.className = "details";
    for (const [kind, text] of [["title", song.title], ["artist", song.artist], ["user", settings.showRequester && song.user ? "Requested by " + song.user : ""]]) {
      const cell = document.createElement("div"); cell.className = kind; cell.textContent = text || ""; details.append(cell);
    }
    row.append(number, details); rows.append(row);
  }
  document.getElementById("empty").hidden = songs.length > 0;
}
streamerz.onSettings(s => {
  settings = s;
  const style = document.documentElement.style;
  for (const key of ["color", "accent", "background"]) style.setProperty("--" + key, s[key]);
  style.setProperty("--font", s.font ? '"' + s.font + '"' : "system-ui");
  document.getElementById("title").textContent = s.title;
  document.getElementById("empty").textContent = s.empty;
  if (topic !== s.topic) {
    topic = s.topic;
    songs = [];
    const listening = topic;
    streamerz.on(listening, value => {
      if (topic !== listening) return;
      songs = Array.isArray(value) ? value.filter(song => song && typeof song === "object" && !song.skip) : [];
      draw();
    });
  }
  draw();
});
</script>
</body>
</html>
