<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starting soon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: var(--font, system-ui), system-ui, sans-serif; color: var(--text, #fff); }
  #picture { position: absolute; inset: 0; background: #18181b center / cover no-repeat; transform: scale(1.04);
    animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: scale(1.12) translate(-1%, -1%); } }
  #shade { position: absolute; inset: 0; background: #000; opacity: var(--dim, .35); }
  #middle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .25em; text-align: center; font-size: calc(32px * var(--scale, 1)); text-shadow: 0 .06em .3em rgba(0, 0, 0, .6); }
  #title { font-size: 3.2em; font-weight: 900; letter-spacing: -.01em; line-height: 1.05; }
  #subtitle { font-size: 1.1em; opacity: .85; }
  #clock { margin-top: .4em; font-size: 2.6em; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent, #a78bfa); }
  #clock.over { animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.06); } }
  #dots { display: flex; gap: .5em; margin-top: .4em; }
  #dots i { width: .45em; height: .45em; border-radius: 50%; background: var(--accent, #a78bfa); animation: dot 1.4s ease-in-out infinite; }
  #dots i:nth-child(2) { animation-delay: .2s; }
  #dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-.25em); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="picture"></div>
<div id="shade"></div>
<div id="middle">
  <div id="title"></div>
  <div id="subtitle"></div>
  <div id="clock"></div>
  <div id="dots"><i></i><i></i><i></i></div>
</div>
<audio id="music" loop></audio>
<script>
// A screen for before the stream. Its picture and its music are "file" settings: one of the overlay's
// files, one of this computer (Streamerz copies it into the overlay's folder) or a web address. The page
// gets each as an address to load, so it goes straight into a CSS url() or an <audio>.
let settings = streamerz.settings;
const opened = Date.now();

streamerz.onSettings(s => {
  settings = s;
  const root = document.documentElement.style;
  root.setProperty("--text", s.textColor || "#fff");
  root.setProperty("--accent", s.accent || "#a78bfa");
  root.setProperty("--scale", (Number(s.scale) || 100) / 100);
  root.setProperty("--dim", (Number(s.dim) || 0) / 100);
  root.setProperty("--font", s.font ? '"' + s.font + '"' : "system-ui");
  title.textContent = s.title || "";
  subtitle.textContent = s.subtitle || "";
  subtitle.hidden = !s.subtitle;
  picture.style.backgroundImage = s.background ? 'url("' + s.background + '")' : "";
  // A new song starts over; the same one keeps playing at the new volume.
  if (music.getAttribute("src") !== (s.music || "")) {
    if (s.music) music.src = s.music;
    else music.removeAttribute("src");
  }
  music.volume = Math.min(1, (Number(s.volume) || 0) / 100);
  if (s.music) music.play().catch(() => streamerz.log("The music did not start: in OBS, tick Control audio via OBS or allow autoplay"));
  else music.pause();
  tick();
});

// The countdown from when the page opened (when its scene is shown, if the source refreshes then).
function tick() {
  const minutes = Number(settings.minutes) || 0;
  clock.hidden = !minutes;
  dots.hidden = !!minutes;
  if (!minutes) return;
  const left = Math.max(0, opened + minutes * 60000 - Date.now());
  const s = Math.ceil(left / 1000);
  clock.textContent = left ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : settings.done || "";
  clock.classList.toggle("over", !left);
}
setInterval(tick, 250);
</script>
</body>
</html>
