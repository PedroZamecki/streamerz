<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subathon timer</title>
<style>
html, body { margin: 0; background: transparent; }
#timer { color: white; font: bold 48px sans-serif; text-shadow: 0 2px 5px black; }
</style>
</head>
<body>
<div id="timer">--:--:--</div>
<script>
(() => {
  const id = "__COUNTDOWN_ID__";
  const params = new URLSearchParams(location.search);
  const address = params.get("server") || "ws://127.0.0.1:8080/";
  const display = document.getElementById("timer");
  let deadline = null;
  let frozen = 0;
  let socket;
  let authFailed = false;
  let authenticating = false;
  let hasState = false;
  function render() {
    const ms = deadline === null ? frozen : Math.max(0, deadline - Date.now());
    const s = Math.ceil(ms / 1000);
    display.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]
      .map(n => String(n).padStart(2, "0")).join(":");
  }
  function update(state) {
    hasState = true;
    frozen = state.remainingMs;
    deadline = state.running ? state.deadlineMs : null;
    render();
  }
  async function digest(text) {
    const bytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return btoa(String.fromCharCode(...new Uint8Array(bytes)));
  }
  function request() {
    socket.send(JSON.stringify({request: "Subscribe", id: "subscribe", events: {Misc: ["StreamerzCountdownChanged"]}}));
    socket.send(JSON.stringify({request: "StreamerzCountdown", id: "countdown", clockId: id}));
  }
  function connect() {
    socket = new WebSocket(address);
    socket.onmessage = async ({data}) => {
      const message = JSON.parse(data);
      if (message.request === "Hello") {
        if (message.authentication) {
          const password = params.get("password");
          if (!password) { authFailed = true; display.textContent = "Authentication required"; socket.close(); return; }
          const secret = await digest(password + message.authentication.salt);
          const authentication = await digest(secret + message.authentication.challenge);
          authenticating = true;
          socket.send(JSON.stringify({request: "Authenticate", id: "auth", authentication}));
        } else request();
      } else if (message.id === "auth" && message.status === "ok") { authenticating = false; request(); }
      else if (message.id === "auth") { authFailed = true; display.textContent = "Authentication failed"; socket.close(); }
      else if (message.id === "countdown" && message.status === "ok") update(message.snapshot);
      else if (message.event?.type === "StreamerzCountdownChanged" && message.data?.clockId === id) update(message.data.snapshot);
    };
    socket.onclose = (event) => {
      deadline = null;
      hasState = false;
      if (authenticating && event.reason === "Authentication failed") {
        authFailed = true;
        display.textContent = "Authentication failed";
      }
      authenticating = false;
      if (!authFailed) { display.textContent = "Disconnected"; setTimeout(connect, 3000); }
    };
  }
  setInterval(() => { if (hasState && socket?.readyState === WebSocket.OPEN) render(); }, 250);
  connect();
})();
</script>
</body>
</html>
