<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viewer count</title>
<style>
html, body { margin: 0; background: transparent; }
#row { display: flex; gap: 36px; align-items: flex-end; color: white; font: bold 56px sans-serif; text-shadow: 0 2px 6px black; }
.item { display: none; flex-direction: column; align-items: center; }
.item.on { display: flex; }
.item small { font-size: 18px; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.dot { height: 6px; width: 100%; border-radius: 3px; margin-top: 6px; }
</style>
</head>
<body>
<div id="row"></div>
<script>
const s = streamerz.settings;
const platforms = { twitch: "#9146ff", youtube: "#ff0033", kick: "#53fc18", tiktok: "#25f4ee" };
const row = document.getElementById("row");
const shown = {}, items = {};
const names = ["total", ...Object.keys(platforms)];
for (const name of names) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = '<span class="n">0</span><small></small><span class="dot"></span>';
  el.querySelector("small").textContent = name === "total" ? (s.totalLabel || "Viewers") : name;
  el.querySelector(".dot").style.background = platforms[name] || (s.accent || "#a78bfa");
  row.appendChild(el);
  items[name] = el;
  shown[name] = 0;
}
// Count from the number on screen to the new one.
function tween(name, to) {
  const el = items[name].querySelector(".n"), from = shown[name], t0 = performance.now();
  const ms = Number(s.animationMs) || 800;
  const step = now => {
    const k = Math.min(1, (now - t0) / ms);
    shown[name] = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = shown[name].toLocaleString();
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
streamerz.on("viewers", v => {
  for (const name of names) {
    const n = v[name];
    const on = n !== null && n !== undefined && (name === "total" ? s.showTotal !== false : s.showPlatforms !== false);
    items[name].classList.toggle("on", on);
    if (on) tween(name, n);
  }
});
</script>
</body>
</html>
